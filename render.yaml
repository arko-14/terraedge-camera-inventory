# Render Blueprint: ONE service running the whole application.
#
# The Dockerfile builds the React app and serves it from the FastAPI process,
# so the web app and the API share an origin. That removes CORS, keeps the
# session cookie SameSite=Lax, and means only one free instance has to wake up.
#
# Create a Blueprint from this repository, then set the three variables marked
# `sync: false` in the Render dashboard. Nothing secret lives in this file.
services:
  - type: web
    name: terraedge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Same origin, so the cookie does not need SameSite=None. Secure is still
      # required: Render terminates TLS and serves over HTTPS.
      - key: COOKIE_SAMESITE
        value: lax
      - key: COOKIE_SECURE
        value: true
      # Generated by Render and never seen by anyone. Rotating it signs every
      # existing session out.
      - key: JWT_SECRET
        generateValue: true
      # Set these in the dashboard.
      - key: DATABASE_URL          # Neon connection string
        sync: false
      # One per demo account; the seed refuses to run if any two match.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CHAHALA_PASSWORD
        sync: false
      - key: SEED_NAWANA_PASSWORD
        sync: false
